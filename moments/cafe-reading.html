        <h1 class="moment-blog-title">阅读与思考</h1>
        <div class="moment-blog-meta">2026-05-09 · 个人学习 · 阅读笔记</div>
        <img class="moment-blog-hero" src="../static/assets/img/background.jpeg" alt="阅读与思考">
        <article class="moment-blog-content">
            <p>我会把阅读分成两类：一类是补基础，另一类是找问题。前者确保知识结构完整，后者帮助我把内容和现实任务连接起来。</p>
            <p>在咖啡馆做笔记时，我通常会留下三个问题：这篇内容解决了什么、假设了什么、还能怎么改进。这样读完后很快能转化成可执行的行动。</p>
            <p>长期看，阅读最有价值的部分不是“读过多少”，而是“是否形成了稳定的方法论”。</p>
        </article>
