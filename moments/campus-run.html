        <img class="moment-blog-hero" src="../static/assets/img/background.jpeg" alt="校园晨跑">
        <article class="moment-blog-content">
            <p>晨跑是我每天开始前的固定仪式。跑步的 30 分钟里，身体先醒过来，思路也会跟着清晰。</p>
            <p>很多课程项目的关键思路，其实不是坐在电脑前硬想出来的，而是在慢跑时一点点串起来。把复杂问题拆成更小的步骤，会更容易推进。</p>
            <p>我喜欢把这一段时间看作“低噪声输入”，不追求速度，只关注呼吸、节奏和当天最重要的一件事。</p>
        </article>
